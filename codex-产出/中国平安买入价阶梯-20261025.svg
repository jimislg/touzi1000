<text x="80" y="300" font-size="11.5" fill="#4b5563">买入线 48 元 = IRR 13.1%，压力假设下仍有 10.7%——高于 10% 机会成本，这 0.7 个点就是安全垫。50.3 元（IRR 12%）压力下只剩 9.5%，破线。</text>
<text x="80" y="320" font-size="11.5" fill="#4b5563">买入价每年随净资产增厚上移约 5.5%：2027-10 → 50.6，2028-10 → 53.4。价格纪律必须配时间刻度，否则刻舟求剑。</text>
