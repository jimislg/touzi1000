<text x="80" y="328" font-size="11.5" fill="#4b5563">真正的风险不在总收入（线下仍 +14.9~48.1%），在同店：国内 +35.2%、亚太 +8.5%、欧洲 +18.5%、美洲 −8.8%。</text>
