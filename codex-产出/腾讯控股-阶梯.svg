<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 830" width="680" height="830" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="830" fill="#0f172a"/>

  <text x="40" y="40" fill="#e2e8f0" font-size="17" font-weight="600">腾讯控股 00700.HK · 价格阶梯</text>
  <text x="40" y="61" fill="#94a3b8" font-size="11">现价 383.60 HKD（2026-10-30）｜ 2026E 经营溢利 2,744.5 亿 ｜ 经营 EV/EBIT 8.27× ｜ 报表 PE 12.96×</text>
  <text x="40" y="79" fill="#64748b" font-size="9.5">四档均已含投资+净现金 98.40 元/股（按今天价值直加，与唐朝法 SOTP 同口径）—— 只有含资产档可与股价直接比较</text>

  <text x="40" y="101" fill="#64748b" font-size="10">↑ 736.19　卖出（减仓）线 DCF 6% · 超出图幅 · 终值占 88%，可信度低</text>

  <!-- H10 651.36 -->
  <line x1="150" y1="130" x2="648" y2="130" stroke="#a78bfa" stroke-width="1.1" opacity="0.75"/>
  <circle cx="150" cy="130" r="3.5" fill="#a78bfa"/>
  <text x="142" y="134" fill="#c4b5fd" font-size="12" text-anchor="end">651.36</text>
  <text x="160" y="126" fill="#c4b5fd" font-size="11">H10（10 年 · 要求 10%）</text>
  <text x="160" y="142" fill="#8b7fd4" font-size="9">现价低 41.1% —— 但 10% 要求回报不是本报告的尺子</text>

  <!-- H12 562.82 主档 -->
  <line x1="150" y1="262" x2="648" y2="262" stroke="#a78bfa" stroke-width="2.2"/>
  <circle cx="150" cy="262" r="4.5" fill="#a78bfa"/>
  <text x="142" y="267" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="end">562.82</text>
  <text x="160" y="254" fill="#c4b5fd" font-size="12.5" font-weight="600">四步法 H12 · 退出 15× 税前 EBIT（主档）</text>
  <text x="160" y="272" fill="#a78bfa" font-size="9">现价低 31.8%，10 年 IRR 17.83% —— 但只在「1,752 亿 capex 全是资产」时成立</text>
  <text x="160" y="286" fill="#64748b" font-size="9">＝ 经营业务 464.42（不可与股价比）＋ 投资+净现金 98.40（今天价值）</text>

  <!-- H15 458.38 -->
  <line x1="150" y1="419" x2="648" y2="419" stroke="#a78bfa" stroke-width="1.4"/>
  <circle cx="150" cy="419" r="4" fill="#a78bfa"/>
  <text x="142" y="423" fill="#c4b5fd" font-size="12" text-anchor="end">458.38</text>
  <text x="160" y="414" fill="#c4b5fd" font-size="11">H15（要求 15%）</text>
  <text x="160" y="431" fill="#8b7fd4" font-size="9">现价低 16.3% —— 与 H12 差 18.6%，这不奇怪：每 1pct hurdle ≈ 7.5% 价格</text>

  <!-- H17.46 392.32 -->
  <line x1="150" y1="519" x2="648" y2="519" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
  <circle cx="150" cy="519" r="3" fill="#a78bfa"/>
  <text x="142" y="523" fill="#8b7fd4" font-size="11" text-anchor="end">392.32</text>
  <text x="160" y="514" fill="#8b7fd4" font-size="10">H17.46（10 年 5 倍）</text>

  <!-- 现价 383.60 -->
  <line x1="150" y1="532" x2="648" y2="532" stroke="#ef4444" stroke-width="2.4" stroke-dasharray="9 5"/>
  <rect x="134" y="524" width="9" height="16" fill="#ef4444" rx="1.5"/>
  <text x="142" y="544" fill="#ef4444" font-size="12.5" font-weight="700" text-anchor="end">383.60</text>
  <rect x="452" y="538" width="106" height="19" fill="#7f1d1d" rx="3"/>
  <text x="505" y="551" fill="#fca5a5" font-size="10.5" font-weight="600" text-anchor="middle">现价 383.60</text>
  <text x="160" y="536" fill="#64748b" font-size="9">现价落在 H17.46 与 FCF 口径 H12 之间：EBIT 口径 IRR 17.83% ／ FCF 口径 9.99%</text>

  <!-- H12 FCF 339.07 -->
  <line x1="150" y1="598" x2="648" y2="598" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="150" cy="598" r="4.5" fill="#22d3ee"/>
  <text x="142" y="603" fill="#67e8f9" font-size="13.5" font-weight="700" text-anchor="end">339.07</text>
  <text x="160" y="591" fill="#67e8f9" font-size="12" font-weight="600">四步法 H12 · FCF 口径（闸门 3 指定的那一侧）</text>
  <text x="160" y="609" fill="#22d3ee" font-size="9">现价高 13.1%，IRR 9.99% —— capex 当成本时，现价是贵的</text>

  <!-- 唐朝法 303.52 -->
  <line x1="150" y1="652" x2="648" y2="652" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="150" cy="652" r="4.5" fill="#38bdf8"/>
  <text x="142" y="657" fill="#7dd3fc" font-size="13.5" font-weight="700" text-anchor="end">303.52</text>
  <text x="160" y="645" fill="#7dd3fc" font-size="12" font-weight="600">唐朝法买入线 DCF 12%（5 年 FCF 992 亿 + SOTP）</text>
  <text x="160" y="663" fill="#38bdf8" font-size="9">与四步法 FCF 口径 339.07 只差 11.7% —— 两法同向，取较低价</text>

  <!-- 加权 13% 线 270.55 -->
  <line x1="150" y1="701" x2="648" y2="701" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="150" cy="701" r="3.5" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="142" y="705" fill="#fbbf24" font-size="11.5" text-anchor="end">270.55</text>
  <text x="160" y="697" fill="#fbbf24" font-size="10">六情景加权 13% 线（加权 IRR 5.38%；最乐观权重也只到 15.89%）</text>

  <!-- 判据三 -->
  <rect x="40" y="722" width="608" height="46" fill="#1e293b" rx="4"/>
  <text x="52" y="741" fill="#e2e8f0" font-size="11.5">判据三：同口径（FCF + 资产直加）两法差 <tspan fill="#22d3ee" font-weight="600">+11.7%</tspan> → 落「10–30%」档 → 取较低价 <tspan fill="#38bdf8" font-weight="600">303.52</tspan>，<tspan fill="#f87171" font-weight="600">不是"方向相反"</tspan></text>
  <text x="52" y="759" fill="#94a3b8" font-size="9.5">真正的开关是 capex：同一个 H12 从 339.07 跳到 562.82（+66%）。现价高于两法，故<tspan fill="#f87171" font-weight="600">不加仓</tspan>。</text>

  <text x="40" y="788" fill="#64748b" font-size="9">间距公式：H12→H15 降 18.6%，来自 (1.12/1.15)¹⁰ = 0.7677（终值占价格 93%，久期 9.7 年）。要求回报每动 1pct，价格动 7.5–8%。</text>
  <text x="40" y="804" fill="#64748b" font-size="9">结构：市值 29.6% 是投资资产（公允 5,732 + 联营 3,299 权益法），经营业务只占 70.4% —— 整体 PE 会把两者算两次。</text>
  <text x="40" y="820" fill="#64748b" font-size="9">经验线因历史峰值 PE 被 1,494.7 亿投资处置收益污染，本轮判定参考价值有限，未入图。</text>
</svg>
