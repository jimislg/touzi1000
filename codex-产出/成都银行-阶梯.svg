  <line x1="32" y1="546" x2="648" y2="546" stroke="#e0e4e8" stroke-width="1"/>

  <!-- 注释 -->
  <text x="32" y="568" font-size="11" font-weight="600" fill="#37474f">退出 PB 敏感性（H12，10 年 12%）—— 这是整个估值最脆弱的一项</text>
  <text x="32" y="586" font-size="10.5" fill="#607d8b">退出 PB　0.70 → 17.40　｜　0.774 → 18.53　｜　<tspan font-weight="700">0.85（十年中位）→ 19.70</tspan>　｜　0.907（当前）→ 20.57　｜　1.00 → 21.99</text>
  <text x="32" y="604" font-size="10.5" fill="#c62828">现值 19.94：按当前 PB 0.907 退出算便宜 3.1%，按十年中位 0.85 退出算贵 1.2% —— 「便宜」只存在于最乐观的退出假设里</text>

  <text x="32" y="628" font-size="11" font-weight="600" fill="#37474f">参数</text>
  <text x="32" y="646" font-size="10.5" fill="#607d8b">起点 BPS 22.85（2026E）｜ 真实 ROE 13.0%（报表 15.39% 不可用）｜ g_bps 7.6% ｜ 派息率 30% ｜ 股息率 4.91%</text>
  <text x="32" y="664" font-size="10.5" fill="#607d8b">ROE 敏感性：12.5% → H12 19.78（现价高 0.8%）｜ 13.0% → 20.57（现价低 3.1%）　★ 判断误差 0.5pct 就会翻转结论</text>
  <text x="32" y="682" font-size="10" fill="#90a4ae" font-style="italic">H 档位由四步法 v3.4.3 定义，唐朝法只引用不修改 ｜ 两法下单价 = min(19.81, 20.57) = 19.81</text>
</svg>
