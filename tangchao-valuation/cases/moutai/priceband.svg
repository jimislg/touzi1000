<svg viewBox="0 0 680 282" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); width:100%;">
<title>贵州茅台 唐朝法买点区间与现价</title>
<desc>贵州茅台 在「A 正常化 3%（默认）」下买点区间 966.3 至 1,099 元，现价 1,335 元。</desc>
