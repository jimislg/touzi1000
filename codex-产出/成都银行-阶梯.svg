  <line x1="163" y1="507" x2="404" y2="507" stroke="#1565c0" stroke-width="1.8"/>
  <circle cx="404" cy="507" r="4.5" fill="#1565c0"/>
  <text x="418" y="504" font-size="11.5" font-weight="600" fill="#1565c0">H17.46 · 10 年 17.46%</text>
