<svg viewBox="0 0 680 446" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">
<title>片仔癀 六种态势定位</title>
<desc>当前态势 高峰拐点型，来源 当前优势型，判断周期 5 年</desc>
<rect x="0" y="0" width="680" height="446" rx="0" fill="#FBFAF7" stroke="#FBFAF7" stroke-width="0"/>
<text x="40" y="38" font-size="14" font-weight="500" fill="#23262F">片仔癀 · Q3 六种态势定位（判断周期 5 年）</text>
<text x="40" y="58" font-size="12" font-weight="400" fill="#5F6472">分类是动态的：同一家公司，不同五年可以落在完全不同的态势</text>
<rect x="40" y="76" width="190" height="92" rx="10" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="0.5"/>
<text x="54" y="102" font-size="13" font-weight="500" fill="#23262F">当前优势型</text>
<text x="54" y="126" font-size="12" font-weight="400" fill="#8A909E">—</text>
<rect x="245" y="76" width="190" height="92" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="259" y="102" font-size="13" font-weight="500" fill="#854F0B">高峰拐点型</text>
<text x="421" y="102" font-size="13" font-weight="500" fill="#854F0B" text-anchor="end">◉</text>
<text x="259" y="126" font-size="12" font-weight="500" fill="#854F0B">当前位置</text>
<rect x="450" y="76" width="190" height="92" rx="10" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="0.5"/>
<text x="464" y="102" font-size="13" font-weight="500" fill="#23262F">持续低迷型</text>
<text x="464" y="126" font-size="12" font-weight="400" fill="#8A909E">—</text>
<rect x="40" y="180" width="190" height="92" rx="10" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="0.5"/>
<text x="54" y="206" font-size="13" font-weight="500" fill="#23262F">低谷拐点型</text>
<text x="54" y="230" font-size="12" font-weight="400" fill="#8A909E">—</text>
<rect x="245" y="180" width="190" height="92" rx="10" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="0.5"/>
<text x="259" y="206" font-size="13" font-weight="500" fill="#23262F">未来优势型</text>
<text x="259" y="230" font-size="12" font-weight="400" fill="#8A909E">—</text>
<rect x="450" y="180" width="190" height="92" rx="10" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="0.5"/>
<text x="464" y="206" font-size="13" font-weight="500" fill="#23262F">难以辨认型</text>
<text x="464" y="230" font-size="12" font-weight="400" fill="#8A909E">—</text>
<rect x="40" y="296" width="600" height="46" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="56" y="325" font-size="13" font-weight="500" fill="#854F0B">来源：当前优势型　→　当前：高峰拐点型</text>
<rect x="40" y="350" width="600" height="76" rx="10" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="0.5"/>
<text x="56" y="374" font-size="12" font-weight="500" fill="#23262F">定位依据</text>
<text x="56" y="396" font-size="12" font-weight="400" fill="#5F6472">增长模型被换掉、提价权已失、金融属性需求消失，属由高峰转向下的拐点；来源是从当前优势型转化，不</text>
<text x="56" y="414" font-size="12" font-weight="400" fill="#5F6472">是行业景气轮回（§3.3、§4 维3、§10、§11）</text>
</svg>